services:
  postgres:
    image: postgres:16-alpine
    container_name: novus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: novus
      POSTGRES_PASSWORD: novus_dev_password
      POSTGRES_DB: novus_dev
    ports:
      - '5432:5432'
    volumes:
      - novus_pgdata:/var/lib/postgresql/data
      - ./infrastructure/docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U novus -d novus_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: novus-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - novus_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  novus_pgdata:
  novus_redisdata:
